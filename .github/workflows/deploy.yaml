name: Build & Deploy Obaidul Mentor Lab

on:
  push:
    branches: [main, master]
    paths:
      - 'Classes/**'
      - 'Blogs/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'sw.js'
      - 'site.webmanifest'
      - 'site-config.json'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - '404.html'
      - 'robots.txt'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate content
        run: npm run validate

      - name: Source regression checks
        run: npm test

      - name: Build encrypted catalog
        env:
          CLASS_ACCESS_PASSWORD: ${{ secrets.CLASS_ACCESS_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          GITHUB_ACTIONS: true
          REQUIRE_PRODUCTION_SECRET: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/build.mjs

      - name: Validate generated site
        env:
          CLASS_ACCESS_PASSWORD: ${{ secrets.CLASS_ACCESS_PASSWORD }}
        run: |
          test -f dist/index.html
          test -f dist/data/catalog.enc.json
          test -f dist/sitemap.xml
          test -f dist/assets/vendor/jszip.min.js
          ! grep -R "demo-only-change-me" dist || (echo "Demo password leaked into build" && exit 1)
          node scripts/verify-build.mjs

      - name: Browser smoke test
        run: node scripts/browser-smoke.mjs

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
