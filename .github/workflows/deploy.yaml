name: Build, Verify & Deploy OWL

on:
  push:
    branches: [test, main]
    paths:
      - 'Classes/**'
      - 'Blogs/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'sw.js'
      - 'site.webmanifest'
      - 'site-config.json'
      - 'workspace-plus.js'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - '404.html'
      - 'robots.txt'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: owl-pages
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build encrypted catalog
        env:
          CLASS_ACCESS_PASSWORD: ${{ secrets.CLASS_ACCESS_PASSWORD || 'demo-only-change-me' }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          GITHUB_ACTIONS: ${{ github.ref == 'refs/heads/main' && 'true' || '' }}
        run: node scripts/build.mjs

      - name: Add Power Workspace to Pages bundle
        run: |
          cp workspace-plus.js dist/workspace-plus.js
          printf '\n<script src="./workspace-plus.js"></script>\n' >> dist/index.html
          node --check workspace-plus.js

      - name: Validate build
        env:
          CLASS_ACCESS_PASSWORD: ${{ secrets.CLASS_ACCESS_PASSWORD || 'demo-only-change-me' }}
        run: |
          node scripts/verify-build.mjs
          test -f dist/index.html
          test -f dist/data/catalog.enc.json
          test -f dist/sitemap.xml
          test -f dist/assets/vendor/jszip.min.js
          test -f dist/workspace-plus.js
          ! grep -R "demo-only-change-me" dist || (echo "Password leaked into build" && exit 1)

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
