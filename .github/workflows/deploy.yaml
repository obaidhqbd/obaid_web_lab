name: Validate OWL Test Branch

on:
  push:
    branches: [test]
    paths:
      - 'Classes/**'
      - 'Blogs/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'sw.js'
      - 'site.webmanifest'
      - 'site-config.json'
      - 'workspace-plus.js'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - '404.html'
      - 'robots.txt'
      - '.github/workflows/deploy.yaml'
      - '.github/workflows/validate-test.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7.0.1
        with:
          ref: test

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build test candidate
        env:
          CLASS_ACCESS_PASSWORD: ${{ secrets.CLASS_ACCESS_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/test', github.repository_owner, github.event.repository.name) }}
          GITHUB_ACTIONS: true
        run: node scripts/build.mjs

      - name: Add Power Workspace and syntax-check it
        run: |
          test -f workspace-plus.js
          cp workspace-plus.js dist/workspace-plus.js
          node --check workspace-plus.js
          node -e "const fs=require('fs');const p='dist/index.html';let s=fs.readFileSync(p,'utf8');const t='<script src="./workspace-plus.js"></script>';if(!s.includes(t))s=s.replace(/<\/body>/i,t+'\n</body>');fs.writeFileSync(p,s)"

      - name: Verify test candidate
        env:
          CLASS_ACCESS_PASSWORD: ${{ secrets.CLASS_ACCESS_PASSWORD }}
        run: |
          node scripts/verify-build.mjs
          test -f dist/workspace-plus.js
