name: Build and deploy student library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Rebuild class and blog catalogue
        run: python scripts/build_catalog.py --check
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate site and indexed files
        run: python scripts/check_site.py
      - name: Prepare static publish directory
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R data content _site/
          if [ -d generated-content ]; then cp -R generated-content _site/; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
